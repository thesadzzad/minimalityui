name: kilo-webhook

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: kilo-webhook-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: forward event to kilo webhook
        env:
          KILO_WEBHOOK_URL: ${{ secrets.KILO_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.sender.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          if [ -z "$KILO_WEBHOOK_URL" ]; then
            echo "::error::KILO_WEBHOOK_URL secret is not set"
            exit 1
          fi

          payload=$(jq -n \
            --arg event "$EVENT_NAME" \
            --arg action "$ACTION" \
            --arg repo "$REPO" \
            --arg sender "$SENDER" \
            --arg issue_number "$ISSUE_NUMBER" \
            --arg issue_title "$ISSUE_TITLE" \
            --arg issue_body "$ISSUE_BODY" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_body "$PR_BODY" \
            --arg pr_base "$PR_BASE" \
            --arg pr_head "$PR_HEAD" \
            --arg pr_url "$PR_URL" \
            --arg comment_body "$COMMENT_BODY" \
            --arg comment_author "$COMMENT_AUTHOR" \
            --arg comment_assoc "$COMMENT_ASSOC" \
            '{
              event: $event,
              action: $action,
              repository: $repo,
              sender: $sender,
              issue: (if $issue_number != "" then { number: ($issue_number | tonumber), title: $issue_title, body: $issue_body } else null end),
              pull_request: (if $pr_number != "" then { number: ($pr_number | tonumber), title: $pr_title, body: $pr_body, base: $pr_base, head: $pr_head, url: $pr_url } else null end),
              comment: (if $comment_body != "" then { body: $comment_body, author: $comment_author, author_association: $comment_assoc } else null end)
            }')

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --request POST \
            --header "Content-Type: application/json" \
            --user-agent "minimalityui-kilo-webhook" \
            --data "$payload" \
            "$KILO_WEBHOOK_URL"
