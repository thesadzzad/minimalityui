name: kilo-scheduler

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: kilo-scheduler
  cancel-in-progress: true

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: forward schedule tick to kilo webhook
        env:
          KILO_WEBHOOK_URL: ${{ secrets.KILO_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCHEDULE_ISO: ${{ github.event.schedule || '' }}
        run: |
          if [ -z "$KILO_WEBHOOK_URL" ]; then
            echo "::error::KILO_WEBHOOK_URL secret is not set"
            exit 1
          fi

          payload=$(jq -n \
            --arg event "$EVENT_NAME" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg schedule "$SCHEDULE_ISO" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              event: $event,
              run_id: $run_id,
              run_url: $run_url,
              schedule: $schedule,
              timestamp: $ts
            }')

          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --request POST \
            --header "Content-Type: application/json" \
            --user-agent "minimalityui-kilo-scheduler" \
            --data "$payload" \
            "$KILO_WEBHOOK_URL"
