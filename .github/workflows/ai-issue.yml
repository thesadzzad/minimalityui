name: AI Issue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  respond:
    name: Respond to issue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Collect existing issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const currentNumber = context.issue.number;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
              sort: 'updated',
              direction: 'desc'
            });
            const contextIssues = issues
              .filter((issue) => !issue.pull_request && issue.number !== currentNumber)
              .slice(0, 100)
              .map((issue) => ({
                number: issue.number,
                title: issue.title,
                body: (issue.body || '').slice(0, 3000),
                state: issue.state,
                labels: issue.labels.map((label) =>
                  typeof label === 'string' ? label : label.name
                )
              }));
            fs.mkdirSync('.ai', { recursive: true });
            fs.writeFileSync('.ai/issues.json', JSON.stringify(contextIssues, null, 2));

      - name: Respond with AI
        id: ai
        uses: cssnr/ai-issue-action@v1
        with:
          token: ${{ steps.app-token.outputs.token }}
          model: big-pickle
          base_url: https://opencode.ai/zen/v1
          instructions: >-
            You are a helpful maintainer triaging a GitHub issue for Minimality UI,
            a Svelte 5 component library. Compare the new report with the supplied
            existing-issue data. Identify a duplicate only when the same concrete
            problem is clearly already tracked. Give a concise, useful response and
            ask clarifying questions when needed. Do not claim a fix was made or invent
            project details. Close reports that contain too little actionable detail
            to investigate, are spam, are test issues, or do not describe a meaningful
            request for this project. Explain clearly and politely why an issue should
            be closed. End with exactly three HTML comments. The first must be
            <!-- ai-issue-labels: LABELS --> using only applicable comma-separated
            labels from bug, enhancement, documentation, question, needs-info,
            invalid, or duplicate. The second must be
            <!-- ai-issue-duplicate: NUMBER --> with the existing issue number for a
            clear duplicate, or none otherwise. The third must be
            <!-- ai-issue-close: REASON --> where REASON is insufficient-details,
            unnecessary, or none. Never use duplicate without a valid matching issue
            number. Use a close reason only when the issue clearly meets its criteria.
          path: .ai/issues.json
          tail: |
            _Response generated by the [AI Issue Action](https://github.com/cssnr/ai-issue-action)._

      - name: Apply triage
        uses: actions/github-script@v8
        env:
          AI_RESPONSE: ${{ steps.ai.outputs.text }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const response = process.env.AI_RESPONSE || '';
            const managed = new Set([
              'bug',
              'enhancement',
              'documentation',
              'question',
              'needs-info',
              'invalid',
              'duplicate'
            ]);
            const labelMatch = response.match(
              /<!--\s*ai-issue-labels:\s*([^]*?)\s*-->/i
            );
            const requested = (labelMatch?.[1] || '')
              .split(',')
              .map((label) => label.trim().toLowerCase())
              .filter((label) => managed.has(label));
            const labels = [...new Set(requested)].filter(
              (label) => label !== 'duplicate'
            );
            const duplicateMatch = response.match(
              /<!--\s*ai-issue-duplicate:\s*(\d+|none)\s*-->/i
            );
            const duplicateNumber = duplicateMatch?.[1] === 'none'
              ? null
              : Number(duplicateMatch?.[1]);
            const closeMatch = response.match(
              /<!--\s*ai-issue-close:\s*(insufficient-details|unnecessary|none)\s*-->/i
            );
            const closeReason = closeMatch?.[1]?.toLowerCase() || 'none';
            if (closeReason !== 'none') {
              labels.push('invalid');
              if (closeReason === 'insufficient-details') labels.push('needs-info');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            if (duplicateNumber && duplicateNumber !== issue_number) {
              try {
                const duplicate = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: duplicateNumber
                });
                if (!duplicate.data.pull_request) {
                  labels.push('duplicate');
                }
              } catch (error) {
                core.warning(`Ignoring invalid duplicate #${duplicateNumber}`);
              }
            }

            const definitions = {
              bug: ['d73a4a', "Something isn't working"],
              enhancement: ['a2eeef', 'New feature or request'],
              documentation: ['0075ca', 'Documentation improvements'],
              question: ['d876e3', 'Further information is requested'],
              'needs-info': ['fbca04', 'More information is needed'],
              invalid: ['e4e669', 'This issue is not actionable'],
              duplicate: ['cfd3d7', 'This issue or pull request already exists']
            };
            for (const label of labels) {
              const [color, description] = definitions[label];
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color,
                  description
                });
              }
            }

            const current = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });
            const currentLabels = current.data.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            );
            const unmanaged = currentLabels.filter((label) => !managed.has(label));
            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number,
              labels: [...new Set([...unmanaged, ...labels])]
            });

            const shouldClose =
              (labels.includes('duplicate') && duplicateNumber) ||
              closeReason !== 'none';
            if (shouldClose) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }
